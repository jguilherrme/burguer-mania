<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação | Burguer Mania</title>
    <link rel="stylesheet" href="assets/style/style-forms.css">
    <link rel="icon" href="assets/images/favicon/favicon.png" type="image/png">
</head>

<body>

    <header>
        <div class="logo">
            <img src="assets/images/logo/logo.png" alt="Imagem do Burguer Mania" class="logo">
        </div>
        <nav class="nav-principal">
            <a href="index.html">Início</a>
            <a href="menu.html">Cardápio</a>
            <a href="#sobre">Nossa História</a>
            <a href="#avaliacoes">Avaliações</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <main class="forms-main">
        <form>
            <h1>
                Deixe aqui sua Avaliação sobre nós!
            </h1>

                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <div class="campo">
                        <h2>
                            Qual a sua opinião sobre o produto comprado?
                        </h2>
                    </div>

                    <div class="estrelas">
                        <input type="radio" name="nota" id="estrela1" value="1">
                        <label for="estrela1">★</label>

                        <input type="radio" name="nota" id="estrela2" value="2">
                        <label for="estrela2">★</label>

                        <input type="radio" name="nota" id="estrela3" value="3">
                        <label for="estrela3">★</label>

                        <input type="radio" name="nota" id="estrela4" value="4">
                        <label for="estrela4">★</label>

                        <input type="radio" name="nota" id="estrela5" value="5">
                        <label for="estrela5">★</label>
                    </div>

                    <div class="campo">
                        <label for="comentario">Deixe seu comentário:</label>
                        <textarea id="comentario" name="comentario" rows="5" cols="40"></textarea>
                    </div>
                    <button type="submit" class="button-forms">
                        Enviar avaliação
                    </button>
        </form>
    </main>

</body>

</html>
